name: Build Nuvio Android Telegram

on:
  push:
    branches:
      - telegram-build
  pull_request:
    branches:
      - cmp-rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Full Debug APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew :androidApp:assembleFullDebug --stacktrace --info 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Telegram-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Telegram-Android
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
